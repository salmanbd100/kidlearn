services:
  postgres:
    image: postgres:16-alpine
    container_name: kidlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kidlearn
    ports:
      - "5432:5432"
    volumes:
      - kidlearn-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kidlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kidlearn-pgdata:
